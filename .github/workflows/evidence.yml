name: Portable signed evidence

on:
  push:
    branches: [main, codex/release-portability-upgrade, codex/release-reliability-v08]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      build_attempt: ${{ steps.create.outputs.build_attempt }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - id: create
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python tools/make_ci_evidence.py --out-dir public-evidence --synthetic-public-demo
      # This job accepts no external bundle path. Only the synthetic fixture
      # above is published; its inventory is retained beside the artifact.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: public-evidence/synthetic-release.zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest_rollout
        with:
          subject-path: public-evidence/synthetic-rollout-observations.json
      - name: Preserve attestation bundles
        env:
          ATTESTATION_PATH: ${{ steps.attest.outputs.bundle-path }}
          ROLLOUT_ATTESTATION_PATH: ${{ steps.attest_rollout.outputs.bundle-path }}
        run: |
          python -c 'import os,shutil; shutil.copyfile(os.environ["ATTESTATION_PATH"], "public-evidence/attestation.json"); shutil.copyfile(os.environ["ROLLOUT_ATTESTATION_PATH"], "public-evidence/rollout-attestation.json")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-release-evidence
          path: public-evidence/
          if-no-files-found: error
          retention-days: 14

  verify-on-second-machine:
    needs: build-evidence
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-release-evidence
          path: transferred-evidence
      - name: Verify transferred bytes and externally expected signer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_RELEASE_ID: ${{ needs.build-evidence.outputs.release_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.build-evidence.outputs.build_attempt }}
        run: python tools/check_ci_evidence.py --directory transferred-evidence
