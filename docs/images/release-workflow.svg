<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Review, test, verify, promote and observe a Langfuse prompt release</title>
<desc id="desc">You use this toolkit around Langfuse to connect a reviewed prompt and test policy to exact versions, dependencies, stored scores, label promotion and observed app requests. You keep the resulting JSON evidence for review or CI handoff.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1118" height="458" rx="22" fill="#f8fafc" stroke="#dbe3ec"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="48" fill="#0f172a" font-size="26" font-weight="700">Follow a prompt change from review to app requests</text>
<text x="36" y="78" fill="#475569" font-size="18">Use your Langfuse prompts, SDKs and evaluators throughout the release.</text>
<rect x="36" y="115" width="192" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="52" y="131" width="44" height="30" rx="8" fill="#e0f2fe"/><text x="61" y="153" font-size="18" font-weight="700" fill="#075985">01</text><text x="52" y="196" font-size="25" font-weight="700" fill="#0f172a">Review</text><text x="52" y="234" font-size="18" fill="#334155">Prompt edits</text><text x="52" y="261" font-size="18" fill="#334155">Required tests</text><path d="M230 205 H246" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="115" width="192" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="266" y="131" width="44" height="30" rx="8" fill="#e0e7ff"/><text x="275" y="153" font-size="18" font-weight="700" fill="#3730a3">02</text><text x="266" y="196" font-size="25" font-weight="700" fill="#0f172a">Test</text><text x="266" y="234" font-size="18" fill="#334155">Exact version</text><text x="266" y="261" font-size="18" fill="#334155">Nested prompts</text><path d="M444 205 H460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="115" width="192" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="480" y="131" width="44" height="30" rx="8" fill="#ccfbf1"/><text x="489" y="153" font-size="18" font-weight="700" fill="#115e59">03</text><text x="480" y="196" font-size="25" font-weight="700" fill="#0f172a">Verify</text><text x="480" y="234" font-size="18" fill="#334155">Cases and scores</text><text x="480" y="261" font-size="18" fill="#334155">Stored results</text><path d="M658 205 H674" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="678" y="115" width="192" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="694" y="131" width="44" height="30" rx="8" fill="#dcfce7"/><text x="703" y="153" font-size="18" font-weight="700" fill="#166534">04</text><text x="694" y="196" font-size="25" font-weight="700" fill="#0f172a">Promote</text><text x="694" y="234" font-size="18" fill="#334155">Selected label</text><text x="694" y="261" font-size="18" fill="#334155">Version readback</text><path d="M872 205 H888" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="892" y="115" width="192" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="908" y="131" width="44" height="30" rx="8" fill="#fef3c7"/><text x="917" y="153" font-size="18" font-weight="700" fill="#92400e">05</text><text x="908" y="196" font-size="25" font-weight="700" fill="#0f172a">Observe</text><text x="908" y="234" font-size="18" fill="#334155">App requests</text><text x="908" y="261" font-size="18" fill="#334155">Cache or fallback</text><rect x="36" y="329" width="1048" height="94" rx="13" fill="#0f172a"/>
<text x="58" y="364" font-size="21" font-weight="700" fill="#ffffff">Keep the release evidence</text>
<text x="58" y="394" font-size="17" fill="#cbd5e1">Inspect JSON reports. Bundle test evidence. Verify optional CI signatures. Review sampled adoption.</text>
</g></svg>